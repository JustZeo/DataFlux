[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataflux"
version = "0.1.0"
description = "A unified Python library for discovering, exploring, and loading datasets from multiple data providers."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = [
    "datasets",
    "data",
    "machine-learning",
    "polars",
    "huggingface",
    "kaggle",
    "uci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.24.0",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torchvision>=0.28.0",
    "ucimlrepo>=0.0.7",
    "vega-datasets>=0.9.0",
    "wbgapi>=1.0.14",
]

[project.urls]
Homepage = "https://github.com/JustZeo/DataFlux"
Repository = "https://github.com/JustZeo/DataFlux"
Documentation = "https://justzeo.github.io/DataFlux/"
Issues = "https://github.com/JustZeo/DataFlux/issues"
Changelog = "https://justzeo.github.io/DataFlux/changelog/"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
]
docs = [
    "mkdocs-material>=9.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataflux"]
