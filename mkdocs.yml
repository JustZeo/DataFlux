site_name: DataFlux
site_description: One API. Every dataset.
repo_url: https://github.com/JustZeo/DataFlux
repo_name: JustZeo/DataFlux

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Core Concepts: getting-started/core-concepts.md
  - Guide:
      - Searching: guide/searching.md
      - Inspecting Datasets: guide/inspecting-datasets.md
      - Pulling Datasets: guide/pulling-datasets.md
      - Exporting Data: guide/exporting-data.md
      - Caching: guide/caching.md
      - Error Handling: guide/error-handling.md
  - Providers:
      - Overview: providers/overview.md
      - UCI: providers/uci.md
      - scikit-learn: providers/sklearn.md
      - Kaggle: providers/kaggle.md
      - Hugging Face: providers/huggingface.md
      - TorchVision: providers/torchvision.md
      - Seaborn: providers/seaborn.md
      - Statsmodels: providers/statsmodels.md
      - Vega: providers/vega.md
      - World Bank: providers/worldbank.md
  - API Reference:
      - flux: api-reference/flux.md
      - Models: api-reference/models.md
      - Exceptions: api-reference/exceptions.md
      - BaseProvider: api-reference/base-provider.md
  - Advanced:
      - Writing a Provider: advanced/writing-a-provider.md
      - Architecture: advanced/architecture.md
      - Contributing: advanced/contributing.md
  - Changelog: changelog.md